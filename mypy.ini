; Root-level mypy config so `mypy backend/core` works from the repo root
; (see backend/pyproject.toml for the equivalent config used when running
; `mypy core` with cwd=backend/).
[mypy]
python_version = 3.12
mypy_path = backend
explicit_package_bases = True
warn_return_any = True
warn_unused_configs = True
no_implicit_optional = True

[mypy-core.*]
strict = True
