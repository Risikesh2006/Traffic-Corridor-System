# Corridor Control — runtime configuration (PRD §18, §14.1)
# Durations are authored in seconds; backend/core/config.py exposes ms fields.

amber_s: 4
all_red_s: 2
min_green_s: 10
ped_clearance_s: 7

max_hold_s: 90
lease_duration_s: 30
lookahead_horizon_s: 90
headway_s: 2.0
startup_loss_s: 2.0
base_buffer_s: 3

tau_density_s: 30
tau_gps_s: 5
density_ttl_s: 60
gps_loss_threshold_s: 3
pessimism_factor: 1.2

uncontrollable_penalty_s: 45
hysteresis_abs_s: 15
hysteresis_rel: 0.10
k_alternatives: 3

corridor_tick_s: 1
periodic_replan_s: 10
heartbeat_interval_s: 1
heartbeat_timeout_s: 3

max_gps_speed_mps: 50

sim_ticks_per_second: 10
default_seed: 4417

# Traffic / queue discharge
jam_spacing_m: 7.5
amber_discharge_fraction: 0.5
turn_through_prob: 0.70
turn_left_prob: 0.15
turn_right_prob: 0.15
yield_factor: 0.0
ambulance_speed_factor: 1.2

# Demand
demand_base_vph: 300
demand_arterial_multiplier: 1.5
demand_internal_source_vph: 30
demand_peak_multiplier: 1.0
demand_hourly_multipliers:
  [0.20, 0.15, 0.10, 0.10, 0.15, 0.30,
   0.60, 0.90, 1.00, 0.70, 0.55, 0.55,
   0.60, 0.55, 0.50, 0.55, 0.65, 0.85,
   1.00, 0.80, 0.55, 0.45, 0.35, 0.25]

# Sensors
sensor_interval_s: 5
sensor_density_noise_std: 0.5

# Vehicle feed
gps_interval_s: 1
gps_noise_std_m: 5.0
map_origin_lat: 12.9716
map_origin_lng: 77.5946

# Network
network_latency_base_ms: 20
network_latency_jitter_ms: 10
network_drop_probability: 0.0
network_duplicate_probability: 0.0

# Safety
# hmac_secret: dev default below; override via CORRIDOR_HMAC_SECRET env var in any
# non-dev deployment — never commit a real secret here.
hmac_secret: "dev-only-insecure-secret-do-not-use-in-production"
idempotency_store_size: 1000
command_rate_limit_per_s: 5.0

# Pedestrians
ped_walk_s: 5.0
ped_call_rate_per_min: 2.0

# Ingestion / validation
max_gps_jump_m: 300
clock_skew_tolerance_s: 0.2

# Historical profile
history_bucket_minutes: 15
history_seeds: [4417, 1, 2, 3, 4]

# Tracking
alpha_beta_alpha: 0.6
alpha_beta_beta: 0.2
ewma_speed_alpha: 0.3
map_match_radius_m: 30
deviation_fix_count: 3
deviation_distance_m: 40
deviation_duration_s: 5
stop_line_margin_m: 15
eta_base_window_s: 5
dead_reckoning_growth_mps: 2.0
eta_k_gps: 0.5
eta_k_speed: 1.0
eta_k_stale: 0.2
eta_k_wait: 0.5
eta_expected_red_fraction: 0.5

# Routing (Phase 5)
ambulance_speed_cap_mps: 20.0
bpr_alpha: 0.15
bpr_beta: 4.0
route_critical_density_fraction: 0.5
route_x_max: 1.5
congestion_sensitivity: 0.5
driving_side: left
allow_u_turns: false
turn_penalty_through_s: 0
turn_penalty_near_side_s: 3
turn_penalty_far_side_s: 5
uncertainty_weight: 0.2
forecast_tau_s: 120
route_alternative_overlap_max: 0.7
route_alternative_budget_expansions: 400
commitment_distance_m: 80
commitment_time_s: 8
min_route_dwell_s: 20
eta_drift_fraction: 0.15
reaction_delay_s: 2
guidance_latency_s: 0.03

latency_input_to_state_ms: 50
latency_corridor_tick_ms: 100
latency_full_replan_ms: 300
latency_closure_to_commands_ms: 500
latency_safety_validation_ms: 5
latency_state_to_ui_ms: 250
